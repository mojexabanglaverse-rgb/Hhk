name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP
        run: |
          ZIP=$(find . -name "*.zip" -type f | head -1)
          unzip "$ZIP" -d extracted/

      - name: Setup Gradle Wrapper
        run: |
          DIR=$(find extracted/ -name "build.gradle.kts" | grep -v "app/" | head -1 | xargs dirname)
          echo "Project dir: $DIR"
          cd "$DIR"
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build APK
        run: |
          DIR=$(find extracted/ -name "build.gradle.kts" | grep -v "app/" | head -1 | xargs dirname)
          cd "$DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-APK
          path: "**/outputs/apk/debug/*.apk"
