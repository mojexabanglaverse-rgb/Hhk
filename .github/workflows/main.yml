name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP
        run: |
          ZIP=$(find . -name "*.zip" -type f | head -1)
          unzip "$ZIP" -d extracted/

      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          DIR=$(find extracted/ -name "build.gradle.kts" | grep -v "app/" | head -1 | xargs dirname)
          cp ~/.android/debug.keystore "$DIR/debug.keystore"

      - name: Setup Gradle Wrapper
        run: |
          DIR=$(find extracted/ -name "build.gradle.kts" | grep -v "app/" | head -1 | xargs dirname)
          cd "$DIR"
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build APK
        run: |
          DIR=$(find extracted/ -name "build.gradle.kts" | grep -v "app/" | head -1 | xargs dirname)
          cd "$DIR"
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file="$PWD/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-APK
          path: "**/outputs/apk/debug/*.apk"
