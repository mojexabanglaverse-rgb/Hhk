name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and build APK
        run: |
          find . -name "gradlew" -type f
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          DIR=$(dirname $GRADLEW)
          chmod +x $GRADLEW
          cd $DIR
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-APK
          path: "**/outputs/apk/debug/*.apk"
